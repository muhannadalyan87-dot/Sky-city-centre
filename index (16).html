  if(p.pay=='تأمين'&&p.appr>0&&p.used>=p.appr){if(!confirm('⚠️ انتهت الجلسات/الموافقة المعتمدة لهذا المريض.\nهل تريد تسجيل الجلسة رغم ذلك؟'))return}
  if(p.pay=='باكج'&&p.pkgN>0&&p.used>=p.pkgN){alert('🔴 انتهت جلسات الباكج — يلزم باكج جديد');return}
  const a=key?S.apts[key]:null,hm=(a&&a.stype=='زيارة منزلية')||(p.pay=='منزلي'||p.pay=='منزلي مانيوال'),cp=p.pay!='تأمين'?0:p.cpM=='نسبة'?+((+p.sp||0)*(+p.cpT||0)/100).toFixed(2):p.cpM=='قيمة/جلسة'?(+p.cpT||0):0;
  p.used=(p.used||0)+1;
  S.ses.push({id:uid(),pid,tid,date,time,type:hm&&p.pay!='منزلي مانيوال'?'منزلي':p.pay,pay:p.pay,no:p.used,tr:hm?(+p.tr||0):0,loc:hm?(p.addr||''):'',sp:+p.sp||0,cp,pct:p.cpM=='نسبة'?+p.cpT:0,co:p.co||'',st:key?+key.split('|')[1]:null,en:a&&a.e||null,by:me.name,ts:Date.now(),ak:key||''});
  if(a){a.st='done';a.no=p.used}
  log(`تم الحضور (${p.pay}) للمريض ${p.no} — ${p.name} — جلسة ${p.used}`);
  save('pts');save('ses');save('apts');render();
  modal(`<h3>✅ تم الحضور — ${esc(p.name)}</h3><p><b>الجلسة ${p.used} من ${tot(p)||'؟'}</b>${cp?` — تحمل هذه الجلسة: ${cp} د.أ`:''}</p>${fsum(p)}<div class=bt><button onclick=cl()>موافق</button></div>`)}
function fsum(p){const r=rem(p),pk=due(p),t=tot(p);
  return `<div class=box style="border:2px solid ${r?'var(--rd)':'var(--gr)'}">${pk?(r?`<b style="color:var(--rd)">🔴 متبقي على المريض: ${r} د.أ</b>`:'<b style="color:var(--gr)">✅ لا يوجد مبلغ مستحق</b>'):'<b>لا يوجد باكج أو تحمل مطلوب حاليًا</b>'}<br>
  ${p.pay=='تأمين'?`شركة التأمين: ${esc(p.co)} ${p.ct?'('+esc(p.ct)+')':''}<br>الجلسات المعتمدة: ${p.appr||0}<br>${p.cpM=='نسبة'?`قيمة الجلسة: ${p.sp||0} د.أ × ${p.appr||0} جلسة — نسبة التحمل ${p.cpT}%<br>`:''}إجمالي التحمل: ${pk} د.أ<br>`:p.pay=='باكج'?`قيمة الباكج: ${pk} د.أ<br>`:''}
  ${pk?`<b>المطلوب: ${pk} د.أ</b> — المدفوع: <b>${paid(p)}</b> د.أ — المتبقي: <b style="color:${r?'var(--rd)':'var(--gr)'}">${r}</b> د.أ<br>`:''}الجلسات المستخدمة: ${p.used||0}${t?` — المتبقية: ${Math.max(0,t-(p.used||0))}`:''}<br>
  ${(p.pays||[]).map((x,i)=>`الدفعة ${ORD[i]||i+1}: ${x.a} د.أ - ${esc(x.m)} <small>(${fmt(x.d)} ${x.t||''} — ${esc(x.by)})</small>`).join('<br>')}</div>`}

  let p=id?pt(id):null;if(!p){p={id:uid(),no:Math.max(20000,...S.pts.map(x=>x.no||0))+1,used:0,abs:0,pays:[],cd:TODAY()};S.pts.push(p)}
  Object.assign(p,{name:n,phone:g('f2'),pay:g('f3'),tid:g('f4'),addr:g('f19'),co:g('f5'),ct:g('f20'),an:g('f6'),appr:+g('f7')||0,sp:+g('f18')||0,cpM:g('f17'),cpT:+g('f8')||0,pkgN:+g('f9')||0,pkgP:+g('f10')||0,tr:+g('f11')||0,fin:$('#f13').checked});

function addPay(id){const a=+$('#pa').value;if(!(a>0))return;const p=pt(id),m=$('#pm').value;(p.pays=p.pays||[]).push({d:TODAY(),t:tm(),a,by:me.name,m});const x=p.pays[p.pays.length-1];x.o=due(p);x.r=rem(p);log(`سجّل دفعة ${a} د.أ (${m}) للمريض ${p.no}`);save('pts');pfile(id);render();

function pfile(id){const p=pt(id),n=(p.used||0)+(p.abs||0),m=me.role=='m',rows=sesRows(p).reverse(),ap=allAp().filter(a=>a.pid==id).sort((a,b)=>a.k<b.k?1:-1);

  <p>✅ حضر: <b>${p.used||0}</b> · ❌ لم يحضر: <b>${p.abs||0}</b> · نسبة الحضور: ${n?Math.round((p.used||0)/n*100):0}%</p>${fsum(p)}
  ${due(p)||p.pay=='تأمين'?`<div class=row2><input id=pa type=number step=0.01 placeholder="مبلغ الدفعة (د.أ)"><select id=pm>${PM().map(o=>`<option>${o}</option>`).join('')}</select></div><button style="margin:6px 0" onclick="addPay('${id}')">تسجيل دفعة</button>`:''}

function delSes(id){if(me.role!='m')return;if(!confirm('حذف هذه الجلسة؟ ستتحدث كل التقارير والحسابات.'))return;const x=S.ses.find(s=>s.id==id),p=pt(x.pid);S.ses=S.ses.filter(s=>s.id!=id);if(p)p.used=Math.max(0,(p.used||0)-1);if(x.ak&&S.apts[x.ak]){S.apts[x.ak].st='booked';delete S.apts[x.ak].no;save('apts')}log(`حذف جلسة ${x.no} للمريض ${p&&p.name} (${x.date})`);save('ses');save('pts');pfile(x.pid);render()}
function cell(k){const a=S.apts[k]||{},[d,h,tid]=k.split('|'),hn=+h;
  if(a.st=='done')return modal(`<h3>تم تنفيذ هذه الجلسة</h3><p>${esc((pt(a.pid)||{}).name)} — جلسة ${a.no||''}</p><button class=g onclick=cl()>إغلاق</button>`);

 <div><label>النوع</label><select onchange="CGF.k=this.value"><option value=short ${CGF.k=='short'?'selected':''}>نواقص — دفع من جيبه للمركز</option><option value=extra ${CGF.k=='extra'?'selected':''}>زوائد — استلم كاش للمركز</option></select></div>
 <div><label>المبلغ (د.أ)</label><input id=cg1 type=number step=0.01 value="${esc(CGF.a)}"></div>
 <div><label>التاريخ</label><input id=cg2 type=date value="${d}"></div></div>
 <label>البيان (جوجل / إعلانات فيسبوك / عصائر ...)</label><input id=cg3 value="${esc(CGF.n)}">
 <div class=bt><button onclick="cgAdd()">حفظ القيد</button></div></div>
 ${rUI()}
 <div class=box><b>الملخص — الفترة المختارة</b><table><tr><th>المدير<th>نواقص<th>زوائد<th>الصافي</tr>${M.map(s=>{const o=cgSum(s.id,per);return `<tr><td>${esc(s.name)}<td>${JD(o.sh)}<td>${JD(o.ex)}<td>${cgTxt(o.net)}</tr>`}).join('')}</table>
 <small>الصافي = زوائد − نواقص. موجب = عليه للمركز، سالب = له من المركز</small></div>
 <div class=box><b>الرصيد التراكمي (كل الفترات)</b><table>${M.map(s=>`<tr><td>${esc(s.name)}<td>${cgTxt(cgSum(s.id,all).net)}</tr>`).join('')}</table></div>
 ${M.map(s=>`<div class=box><b>قيود ${esc(s.name)}</b><table><tr><th>التاريخ<th>النوع<th>المبلغ<th>البيان<th>سجّله<th></tr>${per.filter(x=>x.w==s.id).sort((a,b)=>a.d<b.d?1:-1).map(x=>`<tr><td>${fmt(x.d)}<td>${x.k=='short'?'🔻 نواقص':'🔺 زوائد'}<td>${JD(x.a)}<td style="white-space:normal">${esc(x.n)}<td>${esc(x.by)}<td><button class="s rd" onclick="cgDel('${x.id}')">حذف</button></tr>`).join('')||'<tr><td colspan=6>لا قيود</td></tr>'}</table></div>`).join('')}`};
function cgAdd(){if(!cgOk())return;const a=+$('#cg1').value,n=$('#cg3').value.trim(),d=$('#cg2').value||TODAY();if(!(a>0))return alert('أدخل المبلغ');if(!n)return alert('اكتب البيان');
 (S.cg=S.cg||[]).push({id:uid(),w:CGF.w||me.id,k:CGF.k,a,n,d,by:me.name,at:Date.now()});CGF.a='';CGF.n='';log('سجّل قيداً في جروب الكاش');save('cg');render()}
function cgDel(id){if(!cgOk()||!confirm('حذف هذا القيد؟'))return;S.cg=S.cg.filter(x=>x.id!=id);log('حذف قيداً من جروب الكاش');save('cg');render()}
[TS,TT].forEach(T=>{for(let i=T.length-1;i>=0;i--)if(T[i][0]=='cg')T.splice(i,1)});
if(!TM.some(x=>x[0]=='cg')){const i=TM.findIndex(x=>x[0]=='wd');TM.splice(i>=0?i+1:TM.length,0,['cg','🔒 جروب الكاش'])}

/* v21: نموذج مريض التأمين المبسّط + عدّاد الجلسات والتحمل بجانب تأكيد الحضور */
function sessLine(p){const N=+tot(p)||+p.plan||0,u=p.used||0;return N?`الجلسات: حضر <b>${u}</b> من <b>${N}</b> — باقي <b style="color:${N-u>0?'var(--pr)':'var(--gr)'}">${Math.max(0,N-u)}</b>`:`الجلسات: حضر <b>${u}</b>`}
function sessInfo(p){const d=due(p);return `<div style="font-size:12px;margin-bottom:4px;white-space:normal">${sessLine(p)}${d?`<br>التحمل: مدفوع <b>${paid(p)}</b> من <b>${d}</b> — باقي <b style="color:${rem(p)?'var(--rd)':'var(--gr)'}">${rem(p)}</b>`:''}</div>`}
const pf21=pf;pf=function(id,t){pf21(id,t);const s=$('#f3');if(!s)return;
 const f4=$('#f4');if(f4){f4.disabled=false;if(!id&&me.role=='t')f4.value=me.id}
 if(!id&&t=='تأمين'){const hd=e=>{if(e&&e.parentElement)e.parentElement.style.display='none'};
  ['f2','f21','f3','fpk'].forEach(i=>hd($('#'+i)));
  const f14=$('#f14');if(f14){f14.parentElement.style.display='none';const l=f14.parentElement.previousElementSibling;if(l)l.style.display='none'}
  const w=$('#f24w');if(w)w.style.display='none';
  const ad=$('#f19');if(ad){ad.style.display='none';if(ad.previousElementSibling)ad.previousElementSibling.style.display='none'}
  const lb=f4&&f4.previousElementSibling;if(lb)lb.textContent='المعالج المسؤول (يمكن اختيار أي معالج)'}};

function vpFlt(){const q=$('#vq').value.trim(),s=$('#v1');[...s.options].forEach(o=>{o.hidden=!!q&&!o.textContent.includes(q)});const f=[...s.options].find(o=>!o.hidden);if(f&&q){s.value=f.value}vpPrev()}
function vpPrev(){const p=pt($('#v1').value),b=$('#vpi');if(!p){b.textContent='اختر المريض';return}const a=+$('#v2').value||0,d=expDue(p);
 b.innerHTML=`<b>${esc(p.name)}</b> — ${p.pay}<br>الإجمالي: ${due(p)||'—'} · المدفوع: ${paid(p)} · المتبقي: <b>${d}</b> د.أ${a?`<br>بعد هذه الدفعة المتبقي: <b style="color:var(--gr)">${Math.max(0,+(d-a).toFixed(2))}</b> د.أ`:''}`}

function attC(k,i){ATTN=+(($('#ns'+i)||{}).value)||1;const tv=$('#tr'+i);if(tv&&tv.value!==''&&S.apts[k])S.apts[k].tr=+tv.value;attend(k);const x=S.ses.find(q=>q.ak==k);if(x){let ch=0;S.pts.forEach(p=>(p.pays||[]).forEach(y=>{if(y.pre==k&&!y.sid){y.sid=x.id;y.sn=x.no;ch=1}}));if(ch)save('pts')}render()}
function payRow(k,i){const a=S.apts[k],p=a&&pt(a.pid);if(!p)return;const v=+(($('#pi'+i)||{}).value)||0,m=($('#pm'+i)||{}).value||'كاش';if(!(v>0))return alert('أدخل مبلغ التحمل المدفوع');
 const amt=Math.min(v,Math.max(expDue(p),0));if(!(amt>0))return alert('لا يوجد مبلغ متبقٍ على هذا المريض');const b=rem(p),x=S.ses.find(q=>q.ak==k);
 (p.pays=p.pays||[]).push({d:TODAY(),t:tm(),a:amt,by:me.name,bid:me.id,m,why:p.pay=='تأمين'?'تحمل تأمين':'دفعة',b,pre:k,sn:x?x.no:p.used||0,sid:x?x.id:undefined,cu:me.role=='t'&&m=='كاش'});
 const y=p.pays[p.pays.length-1];y.o=due(p);y.r=rem(p);log(`دفعة ${amt} د.أ (${m}) للمريض ${p.name} — المتبقي ${y.r}`);save('pts');render()}
